<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Housewarming</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet" />
    <style>
      :root {
        --cobalt: #1b3a8f; --deep: #10245e; --line: #e8eefc; --line-dim: rgba(232, 238, 252, 0.28);
        --paper: #f3efe8; --ink: #1d1b18; --act: #d9643a;
      }
      html, body { margin: 0; height: 100%; background: var(--deep); overflow: hidden; color: var(--line); font-family: 'Inter Tight', system-ui, sans-serif; }
      #stage { position: fixed; inset: 0; outline: none; }
      .hud { position: fixed; pointer-events: none; }
      .hud * { pointer-events: auto; }
      [hidden] { display: none !important; }

      #mark { top: 20px; left: 24px; display: flex; align-items: baseline; gap: 12px; }
      #mark b { font-size: 20px; font-weight: 700; letter-spacing: -0.02em; }
      #mark .link { font: 500 12px 'JetBrains Mono', monospace; color: var(--line-dim); padding: 2px 6px; border-radius: 6px; }
      #mark .link:hover { color: var(--line); background: rgba(232, 238, 252, 0.1); }
      #rooms { position: absolute; top: 30px; left: 0; min-width: 200px; display: grid; padding: 6px; border: 1px solid var(--line-dim); border-radius: 12px; background: rgba(16, 36, 94, 0.92); backdrop-filter: blur(10px); }
      #rooms a, #rooms button { text-align: left; font: 500 13px 'JetBrains Mono', monospace; color: var(--line); text-decoration: none; padding: 8px 10px; border-radius: 8px; }
      #rooms a:hover, #rooms button:hover { background: rgba(232, 238, 252, 0.12); }
      #rooms a[aria-current] { color: var(--act); }
      #rooms .new { color: var(--act); border-top: 1px solid var(--line-dim); border-radius: 0 0 8px 8px; margin-top: 4px; }
      #building { inset: 0; display: grid; place-content: center; gap: 22px; background: rgba(16, 36, 94, 0.94); backdrop-filter: blur(6px); text-align: center; }
      #building b { font-size: 26px; letter-spacing: -0.02em; }
      #b-stages { list-style: none; margin: 0; padding: 0; display: flex; gap: 0; border: 1px solid var(--line-dim); border-radius: 12px; overflow: hidden; }
      #b-stages li { padding: 14px 20px; border-right: 1px solid var(--line-dim); font-weight: 600; font-size: 13px; color: var(--line-dim); min-width: 92px; display: grid; gap: 4px; }
      #b-stages li:last-child { border-right: 0; }
      #b-stages li span { font: 500 12px 'JetBrains Mono', monospace; }
      #b-stages li.on { color: var(--line); background: rgba(217, 100, 58, 0.18); }
      #b-stages li.done { color: var(--line); }
      #b-line { font: 500 11px 'JetBrains Mono', monospace; font-style: normal; color: var(--line-dim); max-width: 640px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

      #build { top: 20px; right: 24px; display: flex; gap: 0; border: 1px solid var(--line-dim); border-radius: 10px; overflow: hidden; backdrop-filter: blur(8px); background: rgba(16, 36, 94, 0.55); }
      #build div { padding: 8px 14px; border-right: 1px solid var(--line-dim); display: grid; gap: 2px; min-width: 64px; }
      #build div:last-child { border-right: 0; }
      #build img { height: 46px; width: auto; display: block; border-right: 1px solid var(--line-dim); }
      #build i { font-style: normal; font-size: 11px; font-weight: 600; letter-spacing: 0.02em; }
      #build em { font: 500 12px 'JetBrains Mono', monospace; font-style: normal; color: var(--line-dim); }

      #controls { bottom: 24px; left: 50%; transform: translateX(-50%); display: flex; gap: 8px; align-items: center; }
      .seg { display: flex; border: 1px solid var(--line-dim); border-radius: 999px; padding: 3px; background: rgba(16, 36, 94, 0.55); backdrop-filter: blur(8px); }
      button { font: 600 13px 'Inter Tight', sans-serif; color: var(--line); background: transparent; border: 0; border-radius: 999px; padding: 9px 16px; cursor: pointer; }
      .seg button[aria-pressed='true'] { background: var(--line); color: var(--deep); }
      .solo { border: 1px solid var(--line-dim); background: rgba(16, 36, 94, 0.55); backdrop-filter: blur(8px); }
      .solo:hover, .seg button:hover:not([aria-pressed='true']) { background: rgba(232, 238, 252, 0.12); }
      #open { background: var(--act); color: #fff; border: 1px solid var(--act); }
      #open[disabled] { opacity: 0.35; cursor: default; }
      kbd { font: 500 11px 'JetBrains Mono', monospace; opacity: 0.6; margin-left: 6px; }

      #loading { inset: 0; display: grid; place-items: center; background: var(--deep); transition: opacity 0.5s; }
      #loading b { font-size: 28px; letter-spacing: -0.02em; }
      body.ready #loading { opacity: 0; pointer-events: none; }
      @media (max-width: 720px) { #build { display: none; } #mark { left: 16px; } }
    </style>
  </head>
  <body>
    <div id="stage" tabindex="0"></div>
    <div class="hud" id="mark"><b>Housewarming</b><button id="room-name" class="link"></button>
      <div id="rooms" hidden></div>
    </div>
    <input type="file" id="file" accept="video/mp4,video/quicktime,image/jpeg,image/png,image/webp" hidden />
    <div class="hud" id="building" hidden>
      <b id="b-name"></b>
      <ol id="b-stages"></ol>
      <em id="b-line"></em>
    </div>
    <div class="hud" id="build" hidden></div>
    <div class="hud" id="controls">
      <div class="seg" id="viewseg" hidden>
        <button data-view="room" aria-pressed="true">Room</button>
        <button data-view="blueprint" aria-pressed="false">Blueprint</button>
      </div>
      <button id="open" disabled>Open<kbd>F</kbd></button>
      <button class="solo" id="export">MJCF<kbd>M</kbd></button>
    </div>
    <div class="hud" id="loading"><b>Housewarming</b></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
